name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven packages and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify tag matches Maven version
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{tag}" >/dev/null
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          expected_version="${GITHUB_REF_NAME#v}"
          test "$pom_version" = "$expected_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Maven version $pom_version." >&2
            exit 1
          }
      - name: Publish release artifacts to GitHub Packages
        run: mvn -B -ntp -Prelease deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve a deployed package from GitHub Packages with an empty local repository
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mvn -B -ntp \
            -Dmaven.repo.local="$RUNNER_TEMP/github-packages-smoke-test" \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact="io.github.vicliu624.explicitarchitecture:explicit-architecture-atlas-annotations:${RELEASE_TAG#v}" \
            -DremoteRepositories="github::default::https://maven.pkg.github.com/vicliu624/Explicit-Architecture-Atlas"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Explicit Architecture Atlas $GITHUB_REF_NAME" \
              --generate-notes
          fi
