name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to verify and finalize after a successful package deployment
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven packages and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify tag matches Maven version
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{tag}" >/dev/null
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          expected_version="${RELEASE_TAG#v}"
          test "$pom_version" = "$expected_version" || {
            echo "Tag $RELEASE_TAG does not match Maven version $pom_version." >&2
            exit 1
          }
      - name: Publish release artifacts to GitHub Packages
        if: github.event_name == 'push'
        run: mvn -B -ntp -Prelease deploy
      - name: Resolve a deployed package from GitHub Packages with an empty local repository
        shell: bash
        run: |
          mvn -B -ntp \
            -Dmaven.repo.local="$RUNNER_TEMP/github-packages-smoke-test" \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact="io.github.vicliu624.explicitarchitecture:explicit-architecture-atlas-annotations:${RELEASE_TAG#v}" \
            -DremoteRepositories="github::default::https://maven.pkg.github.com/vicliu624/Explicit-Architecture-Atlas"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Explicit Architecture Atlas $RELEASE_TAG" \
              --generate-notes
          fi
