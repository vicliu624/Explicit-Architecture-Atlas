name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish, for example v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Sign, validate, and publish the selected release tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify release tag and Maven version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tag must start with v and a numeric version." >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{tag}" >/dev/null
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$pom_version" = "${RELEASE_TAG#v}" || {
            echo "Tag $RELEASE_TAG does not match Maven version $pom_version." >&2
            exit 1
          }
      - name: Import the protected PGP signing key
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          test -n "$MAVEN_GPG_PRIVATE_KEY" || {
            echo "MAVEN_GPG_PRIVATE_KEY is not configured in the maven-central environment." >&2
            exit 1
          }
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish the signed Central Portal bundle
        run: mvn -B -ntp -Prelease,central-release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Resolve a published artifact from Maven Central with an empty local repository
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mvn -B -ntp \
            -Dmaven.repo.local="$RUNNER_TEMP/central-smoke-test" \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact="io.github.vicliu624.explicitarchitecture:explicit-architecture-atlas-annotations:${RELEASE_TAG#v}"
