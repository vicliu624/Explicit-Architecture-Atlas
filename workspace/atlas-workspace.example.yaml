# 复制到 workspace/local/ 后按部署环境填写；不要把真实内容回写到此模板。
schemaVersion: "1.0"
workspaceId: "workspace:example-project"
project:
  id: "project:example-project"
  displayName: "示例 Explicit Architecture 项目"
sources:
  projectRoot: "<absolute-path-to-project>"
  sourceArchives: []
  # 注解处理器编译产出的 META-INF/explicit-architecture-atlas/atlas-intent.json。
  intentManifests: []
content:
  root: "<absolute-path-to-private-content-pack>"
runtime:
  enabled: false
  # 离线导出的脱敏 Axon 观测文件。真实文件只应放在 workspace/local/ 或安全导出目录。
  observationFiles: []
# 允许省略；没有 Profile 时 Atlas 只按内建/显式能力工作，不会猜测未实现的技术关系。
# conventionProfileFile: "<absolute-path-to-convention-profile.json>"
